name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Antigravity Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          mkdir -p release-apks
          
          # Copy Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-apks/Antigravity-Mobile-${TAG}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-apks/Antigravity-Mobile-${TAG}.apk"
          fi
          
          # Copy Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-apks/Antigravity-Mobile-${TAG}-debug.apk"
          fi
          
          ls -lh release-apks/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Google Antigravity Mobile ${{ github.ref_name }}
          body: |
            ## 🚀 Google Antigravity Mobile ${{ github.ref_name }}

            Google Antigravity Android 客户端移动端版本发布。

            ### 📱 功能特性
            - **Google Antigravity 全新品牌**：反重力能量环图标与主题。
            - **默认连接服务**：默认直连 `http://fn0.xx.kg:3100`。
            - **原生下拉刷新 (Pull-to-Refresh)**：优化手势滑动与页面即时刷新。
            - **深色模式与沉浸式状态栏**：适配手机系统栏与防闪黑优化。
            - **文件与图片即时上传**：支持拍照、相册多选上传至工作区。

            ### 📦 安装包下载
            - **安装包 (推荐)**: `Antigravity-Mobile-${{ github.ref_name }}.apk`
            - **Debug 测试包**: `Antigravity-Mobile-${{ github.ref_name }}-debug.apk`

            ### 📲 安装指南
            1. 下载 APK 并安装（若提示未知来源请允许安装）。
            2. 打开应用即可连接到 Antigravity WebUI 开启 AI 编程体验。
          files: |
            release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Mobile-APKs
          path: release-apks/*.apk
          retention-days: 30
